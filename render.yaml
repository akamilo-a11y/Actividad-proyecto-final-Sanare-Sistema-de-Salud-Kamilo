services:
  # -------------------------------------------------------------
  # Backend NestJS Web Service
  # -------------------------------------------------------------
  - type: web
    name: saludpublica-backend
    runtime: node
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm run start:prod
    healthCheckPath: /api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: saludpublica-db
          property: connectionString
      - key: REDIS_URL
        value: redis://localhost:6379 # Configurar con Redis de Render o Upstash en producción
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        value: https://saludpublica-frontend.onrender.com,http://localhost:3000

  # -------------------------------------------------------------
  # Frontend React SPA (Static Site)
  # -------------------------------------------------------------
  - type: web
    name: saludpublica-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: saludpublica-backend
          property: host

databases:
  # -------------------------------------------------------------
  # Base de Datos PostgreSQL Administrada en Render
  # -------------------------------------------------------------
  - name: saludpublica-db
    databaseName: saludpublica
    user: saludpublica_user
    plan: free
    region: oregon
